kind = "web"
previewPath = "/"
title = "Electrical Engineering Company Profile"
version = "1.0.0"
id = "artifacts/company-profile"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19916

[services.development]
run = "pnpm --filter @workspace/company-profile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/company-profile", "run", "build" ]
serve = "static"
publicDir = "artifacts/company-profile/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19916"
BASE_PATH = "/"
